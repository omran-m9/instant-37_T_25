<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">

    <link rel="stylesheet" href="css/style.css">


</head>

<body style="background-color: #f6f8ff;">

    <!-- Start header register Section  -->

    <header class="header-register mt-5">

        <div class="container">
            <div class="row">
                <div class="md:col-6">
                    <img src="img/56f58c5bbae6320e1aa5d36445fd722b.jpg" class="w-75">
                </div>
                <div class="md:col-6">
                    <h2 class="fg-black">Create Account</h2>
                    <h4 class="fg-secondary mt-4 mb-7">Go ahead and sign up,let everyone<br>
                        know how awesome you are</h4>
                        <h4 id="result"></h4>
                    <form onsubmit="return vaildateValue()" action="success.html" method="post">
                        <input id="user" type="text" placeholder="User Name" name="user"
                            class="fg-black form-control bg-white mb-7 p-4 rounded-2">
                        <input id="email" type="text" placeholder="Email" name="email"
                            class="fg-black form-control bg-white mb-7 p-4 rounded-2">
                        <input id="pass" type="password" placeholder="Password" name="pass"
                            class="fg-black form-control bg-white mb-7 p-4 rounded-2">
                        <input id="confirm" type="password" placeholder="Confirm Password" name="confirm"
                            class="fg-black form-control bg-white mb-7 p-4 rounded-2">

                        <input type="submit" value="Creat New Account" class="btn-solid theme-primary d-block w-100">


                    </form>


                </div>
            </div>
        </div>

    </header>

    <!-- End header register Section  -->

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
